plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = '1MB-Locator-HUD'
}

repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:deprecation')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        locatorhud {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    clientRuntimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'fabric_api_version', project.fabric_api_version

    filesMatching('fabric.mod.json') {
        expand([
            version: project.version,
            fabric_api_version: project.fabric_api_version
        ])
    }
}
